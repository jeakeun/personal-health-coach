name: CI

# 러너를 windows-latest 로 고정한 이유:
#   SecretStorePort 의 DPAPI 어댑터는 Windows 전용입니다. Linux 러너에서는
#   대체 구현으로 우회하게 되어 "테스트는 통과하는데 실제 환경에서는 동작하지
#   않는" 상태가 만들어집니다. 카오스 실험 C3(키 저장소 차단)도 실환경에서만
#   의미가 있습니다.  (Infrastructure Design I4=A)

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 30

    # ⭐ 러너의 콘솔 인코딩이 cp1252 라, 한글이 섞인 출력을 그대로 쓰면
    #    UnicodeEncodeError 로 게이트가 죽습니다. 계약 이름(C1~C4)도 테스트
    #    이름도 한글이므로 게이트 4·5·6 이 전부 해당됩니다.
    #
    #    ⚠ 실제로 첫 CI 실행에서 게이트 4 가 이렇게 죽었습니다 — **계약을
    #      평가하다 실패한 것이 아니라 결과를 출력하다 죽어서**, 경계 A·B 가
    #      검사된 적이 없는 상태였습니다 (F-28).
    #      `.importlinter` 의 cp949 문제(F-06), `alembic.ini` 의 cp949
    #      문제(F-20) 에 이은 같은 원인 세 번째입니다.
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python 3.12
        run: uv python install 3.12

      # --- 게이트 1: 의존성 lock 검증 (NFR-07) -------------------------------
      # --locked 는 uv.lock 과 pyproject.toml 이 어긋나면 실패합니다.
      # lock 파일 없이 설치되는 경로를 만들지 않습니다.
      - name: "게이트 1 · 의존성 (lock 검증)"
        run: uv sync --locked --all-extras

      # --- 게이트 2: 포맷·린트 ------------------------------------------------
      # ⚠ 한 단계에 명령을 여러 줄로 넣지 않습니다 (F-29).
      #    pwsh 는 마지막 명령의 종료 코드만 단계 결과로 삼으므로, 앞 명령이
      #    실패해도 뒤가 성공하면 단계 전체가 통과합니다 — 게이트가 조용히
      #    무력해집니다. 명령마다 단계를 나누는 것이 그 자체로 방어입니다.
      - name: "게이트 2 · ruff format"
        run: uv run ruff format --check .

      - name: "게이트 2 · ruff check"
        run: uv run ruff check .

      # --- 게이트 3: 타입 검사 ------------------------------------------------
      - name: "게이트 3 · mypy"
        run: uv run mypy

      # --- 게이트 4: 모듈 경계 린트 (NFR-1A-33) ⭐ ----------------------------
      # 경계 A(C3) 와 경계 B(C2) 를 기계적으로 집행하는 지점입니다.
      # 이 게이트가 통과했다고 끝이 아니라, 의도적 위반을 실제로 잡아내는지
      # tests/integration/test_boundary_lint.py 가 별도로 검증합니다.
      # 계약은 pyproject.toml 의 [tool.importlinter] 에 있습니다.
      # 별도 .importlinter 파일을 쓰지 않는 이유: configparser 가 파일을
      # 로케일 인코딩(한국어 Windows 에서 cp949)으로 읽어 한글 주석이 깨집니다.
      - name: "게이트 4 · import-linter (경계 A·B)"
        run: uv run lint-imports

      # --- 게이트 5: 단위 테스트 ----------------------------------------------
      - name: "게이트 5 · 단위 테스트"
        run: uv run pytest tests/unit

      # --- 게이트 6: 속성 테스트 (NFR-1A-35) ----------------------------------
      # 실패 시 Hypothesis 가 재현 시드를 출력하도록 -p no:randomly 와
      # 상세 출력을 켭니다. 시드 없이 실패하면 재현이 불가능합니다 (NFR-27).
      - name: "게이트 6 · 속성 테스트 (Hypothesis)"
        run: uv run pytest tests/property -v --hypothesis-show-statistics

      # --- 게이트 7: 커버리지 (NFR-1A-34) -------------------------------------
      # 전체 80% 는 pyproject.toml 의 fail_under 가, identity 90% 는 아래가 검사.
      #
      # ⚠ 두 단계로 나눈 이유는 F-29 — 한 블록에 두면 `pytest --cov` 가
      #   80% 미달로 실패해도 뒤의 identity 검사가 통과하는 순간 게이트가
      #   통과합니다. 실제로 첫 CI 실행에서 커버리지 73.1% 가 통과로
      #   보고되었습니다.
      - name: "게이트 7 · 커버리지 (전체 80%)"
        run: uv run pytest --cov --cov-report=xml --cov-report=term

      - name: "게이트 7 · 커버리지 (identity 90%)"
        run: uv run python scripts/check_module_coverage.py --module phc.identity --min 90

      # --- 게이트 8: 취약점 스캔 (SECURITY-10) --------------------------------
      # 환경이 아니라 **잠금된 의존성 목록**을 감사합니다.
      #
      # 환경을 감사하면 editable 로 설치된 이 프로젝트 자신이 포함되는데,
      # PyPI 에 없는 패키지라 `--strict` 가 "감사 불가" 로 판정해 실패합니다
      # (`--skip-editable` 도 마찬가지 — strict 는 건너뛴 것도 실패로 봅니다).
      #
      # lock 파일을 감사하면 그 문제가 사라질 뿐 아니라, **실제로 배포될 정확한
      # 버전 집합**을 검사하게 되어 강도가 올라갑니다 (SECURITY-10).
      - name: "게이트 8 · 의존성 목록 추출"
        run: uv export --format requirements-txt --all-extras --no-emit-project --no-hashes -o requirements-audit.txt

      - name: "게이트 8 · pip-audit"
        run: uv run pip-audit --strict -r requirements-audit.txt

      # --- 게이트 9: SBOM 생성 (NFR-07, SECURITY-10) --------------------------
      - name: "게이트 9 · SBOM (CycloneDX)"
        run: uv run cyclonedx-py environment -o sbom.json

      - name: SBOM 업로드
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

      # 태그 push 시 릴리스에 SBOM 첨부
      - name: 릴리스에 SBOM 첨부
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: sbom.json
