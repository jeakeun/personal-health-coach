# Alembic configuration (S30)
#
# ASCII ONLY -- DO NOT WRITE KOREAN HERE.
#   configparser reads this file with the locale encoding (cp949 on Korean
#   Windows) and fails with UnicodeDecodeError on UTF-8 Korean text. This is
#   the same failure as finding F-06, where the import-linter contracts had to
#   be moved out of .importlinter into pyproject.toml for exactly this reason.
#   Rationale and comments in Korean belong in migrations/env.py (a UTF-8
#   Python source file).
#
# The database URL is intentionally absent. The real database lives under
# %LOCALAPPDATA%\PersonalHealthCoach\data\ (I2=B) and differs per user, so
# pinning a path here would commit a path that does not match reality.
# migrations/env.py resolves it: -x db=... -> PHC_DB_PATH -> default location.

[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os

# Revision ids are 4-digit sequence numbers (0001, 0002, ...) because the id
# is stored as BackupArtifact.schema_version (BR-BK-07); a hash would make the
# ordering unreadable from backup metadata alone.
file_template = %%(rev)s_%%(slug)s
